name: Toolbox freshness

on:
  pull_request:
    paths:
      - "README.md"
      - ".github/scripts/check-toolbox.sh"
      - ".github/workflows/toolbox-freshness.yml"
  schedule:
    - cron: "41 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check Toolbox repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/check-toolbox.sh README.md
